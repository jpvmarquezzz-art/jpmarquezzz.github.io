<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="app-page" content="products" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products | Marquezcents Co.</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <img src="images/logo3.png" alt="Logo" />
      <div>
        <h1>{{ companyName }}</h1>
        <p>{{ tagline }}</p>
      </div>
    </div>
    <div class="header-actions">
      <div class="pill">Cart Items: <strong>{{ cartCount }}</strong></div>
    </div>
  </header>

  <div class="container">
    <nav>
      <ul>
        <li v-for="link in navLinks" :key="link.text">
          <a v-if="!link.action" class="nav-link" :href="link.href" :class="{ active: link.page === page }">
            <span>{{ link.text }}</span>
            <span v-if="link.badge !== undefined" class="badge">{{ link.badge }}</span>
          </a>
          <button v-else class="nav-link" type="button" @click="handleNav(link)">
            <span>{{ link.text }}</span>
          </button>
        </li>
      </ul>
    </nav>

    <main>
      <h2>Products</h2>
      <div class="alert ok" v-if="notice">{{ notice }}</div>
      <div class="alert err" v-if="error">{{ error }}</div>

      <div class="grid">
        <div class="card" v-for="p in products" :key="p.id">
          <img class="product-img" :src="p.img" :alt="p.name" />
          <div class="product-title">{{ p.name }}</div>
          <div class="price">{{ fmtMoney(p.price) }}</div>
          <div class="btn-row">
            <button class="btn" @click="addToCart(p)">Add to Cart</button>
            <a class="btn secondary" href="cart.html">Go to Cart</a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <footer><p>&copy; {{ year }} | {{ companyName }}</p></footer>

</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="script.js"></script>
</body>
</html>
